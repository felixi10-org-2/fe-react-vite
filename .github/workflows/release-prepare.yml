name: Release Prepare

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-prepare
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          # cache: npm

      - name: Install dependencies
        run: npm ci

      # Replace this with the organization's GitHub App
      # token-generation mechanism.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Determine release
        id: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          npx semantic-release \
            --dry-run \
            --no-ci \
            2>&1 | tee semantic-release.log

          VERSION="$(
            sed -nE \
              's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' \
              semantic-release.log |
            tail -1
          )"

          if [[ -z "$VERSION" ]]; then
            echo "released=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release branch
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="release/v${VERSION}"

          git switch -c "$BRANCH"

          # Example if package.json version must be committed:
          npm version "$VERSION" --no-git-tag-version

          git config user.name "release-bot"
          git config user.email "release-bot@invalid"

          git add package.json package-lock.json

          git commit \
            -m "chore(release): v${VERSION}"

          git push origin "$BRANCH"

      - name: Create pull request
        if: steps.release.outputs.released == 'true'
        env:
          GHES_API: ${{ github.api_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          BRANCH="release/v${VERSION}"

          curl --fail-with-body \
            -X POST \
            "${GHES_API}/repos/${GITHUB_REPOSITORY}/pulls" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg title "chore(release): v${VERSION}" \
              --arg head "$BRANCH" \
              --arg base "main" \
              --arg body "Automated semantic-release PR for v${VERSION}." \
              '{
                title: $title,
                head: $head,
                base: $base,
                body: $body
              }'
            )"
