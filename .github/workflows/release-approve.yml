name: Release Approve

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read
  checks: read

concurrency:
  group: release-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  approve:
    name: Approve Release PR
    if: startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest

    steps:
      - name: Create approval App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Wait for required checks
        env:
          GHES_API: ${{ github.api_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 60); do

            PR_JSON="$(
              curl --fail-with-body \
                -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GHES_API}/repos/${OWNER}/${REPO}/pulls/${PR}"
            )"

            HEAD_SHA="$(jq -r '.head.sha' <<< "$PR_JSON")"

            CHECKS_JSON="$(
              curl --fail-with-body \
                -sS \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H "Accept: application/vnd.github+json" \
                "${GHES_API}/repos/${OWNER}/${REPO}/commits/${HEAD_SHA}/check-runs"
            )"

            FAILED="$(
              jq '
                [
                  .check_runs[]
                  | select(
                      .status == "completed"
                      and
                      (.conclusion != "success")
                      and
                      (.conclusion != "skipped")
                    )
                ] | length
              ' <<< "$CHECKS_JSON"
            )"

            PENDING="$(
              jq '
                [
                  .check_runs[]
                  | select(.status != "completed")
                ] | length
              ' <<< "$CHECKS_JSON"
            )"

            echo "HEAD: ${HEAD_SHA}"
            echo "Failed checks: ${FAILED}"
            echo "Pending checks: ${PENDING}"

            if [[ "$FAILED" != "0" ]]; then
              echo "Required checks failed."
              exit 1
            fi

            if [[ "$PENDING" == "0" ]]; then
              echo "Checks completed."
              break
            fi

            sleep 10
          done

      - name: Re-read PR HEAD
        id: head
        env:
          GHES_API: ${{ github.api_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          HEAD_SHA="$(
            curl --fail-with-body \
              -sS \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "${GHES_API}/repos/${OWNER}/${REPO}/pulls/${PR}" |
            jq -r '.head.sha'
          )"

          echo "sha=${HEAD_SHA}" >> "$GITHUB_OUTPUT"

      - name: Approve PR
        env:
          GHES_API: ${{ github.api_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ steps.head.outputs.sha }}
        run: |
          set -euo pipefail

          curl --fail-with-body \
            -X POST \
            "${GHES_API}/repos/${OWNER}/${REPO}/pulls/${PR}/reviews" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg commit_id "$HEAD_SHA" \
              '{
                commit_id: $commit_id,
                body: "Automated release validation passed.",
                event: "APPROVE"
              }'
            )"
